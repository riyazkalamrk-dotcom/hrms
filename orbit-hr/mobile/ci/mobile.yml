# Copy this file to  .github/workflows/mobile.yml  in your repository.
# Builds a signed Android AAB + APK on Linux and an iOS build → TestFlight on a Mac. No local tools needed.
#
# Repository VARIABLES (Settings → Secrets and variables → Actions → Variables):
#   ORBIT_SERVER   https://hr.yourcompany.com
#   ORBIT_APP_ID   com.yourcompany.hr
#   ORBIT_APP_NAME Your Company HR
# Repository SECRETS:
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   (base64 -w0 release.jks)
#   GOOGLE_SERVICES_JSON                       (contents of google-services.json, for Android push)
#   IOS_CERT_P12_B64, IOS_CERT_PASSWORD        (Apple Distribution certificate .p12, base64)
#   IOS_PROFILE_B64                            (App Store provisioning profile, base64)
#   APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8   (App Store Connect API key — for TestFlight upload)
name: mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.js', '**.css', '**.html', 'mobile/**']
env:
  WEB: ${{ github.workspace }}
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci || npm install
      - name: Firebase + signing files
        run: |
          mkdir -p firebase && echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > firebase/google-services.json
          echo '${{ secrets.ANDROID_KEYSTORE_B64 }}' | base64 -d > release.jks
      - run: npm run setup -- --web "$WEB" --server "${{ vars.ORBIT_SERVER }}" --id "${{ vars.ORBIT_APP_ID }}" --name "${{ vars.ORBIT_APP_NAME }}" --only android --iconserver "${{ vars.ORBIT_SERVER }}"
      - name: Keystore properties
        run: |
          printf "storeFile=../release.jks\nstorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}\nkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}\nkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}\n" > android/keystore.properties
      - run: ORBIT_VERSION=1.0.${{ github.run_number }} ORBIT_VERSION_CODE=${{ github.run_number }} npm run android:aab
      - run: ORBIT_VERSION=1.0.${{ github.run_number }} ORBIT_VERSION_CODE=${{ github.run_number }} npm run android:apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: mobile/dist/* }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm run setup -- --web "$WEB" --server "${{ vars.ORBIT_SERVER }}" --id "${{ vars.ORBIT_APP_ID }}" --name "${{ vars.ORBIT_APP_NAME }}" --only ios --iconserver "${{ vars.ORBIT_SERVER }}"
      - uses: apple-actions/import-codesign-certs@v3
        with: { p12-file-base64: '${{ secrets.IOS_CERT_P12_B64 }}', p12-password: '${{ secrets.IOS_CERT_PASSWORD }}' }
      - name: Provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo '${{ secrets.IOS_PROFILE_B64 }}' | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/orbit.mobileprovision
          UUID=$(grep -a -A1 UUID ~/Library/MobileDevice/Provisioning\ Profiles/orbit.mobileprovision | grep -io '[0-9a-f-]\{36\}' | head -1)
          mv ~/Library/MobileDevice/Provisioning\ Profiles/orbit.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
      - name: Archive + export
        working-directory: mobile/ios/App
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>${{ vars.ORBIT_APP_ID }}</key><string>${{ vars.ORBIT_IOS_PROFILE_NAME }}</string></dict></dict></plist>
          EOF
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -archivePath build/App.xcarchive archive \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="${{ vars.ORBIT_IOS_PROFILE_NAME }}"
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/ipa
      - uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: mobile/ios/App/build/ipa/App.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_KEY_P8 }}
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: mobile/ios/App/build/ipa/*.ipa }
